name: Scanner SMA

on:
  schedule:
    - cron: "17 20 * * 1-5"
    - cron: "47 20 * * 1-5"
    - cron: "17 21 * * 1-5"
    - cron: "47 21 * * 1-5"
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar_envio:
        description: "Enviar Telegram aunque ya se haya enviado hoy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency: scanner-sma

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install yfinance pandas
      - name: Ejecutar scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ inputs.forzar_envio }}
        run: python scanner.py
      - name: Guardar datos
        run: |
          git config user.name "scanner-sma-bot"
          git config user.email "scanner-sma-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Datos $(date -u +%F)" && git push)
      - name: Publicar en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo lanzar la publicación de Pages"
